name: CI

# Fast, deterministic checks on every push / PR. No Docker, no databases.
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build (Release)
        run: dotnet build Benchmark.sln -c Release

      # Core unit tests + architecture guards + JSON/regression-gate logic — all Docker-free.
      - name: Fast tests
        run: dotnet test tests/Benchmark.UnitTests/Benchmark.UnitTests.csproj -c Release --no-build
